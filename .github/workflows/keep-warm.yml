name: Keep backend warm

# Pings the Render backend so the free-tier web service does not spin down.
# Render sleeps a free service after ~15 minutes of inactivity; the next
# request then takes 30-60s to wake. This keeps it responsive for demos
# and TiE judging. Also use a dedicated uptime monitor for tighter timing.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS -f --max-time 90 --retry 3 --retry-delay 20 \
            https://raise-toolkit.onrender.com/api/health \
            && echo "Backend is awake"
